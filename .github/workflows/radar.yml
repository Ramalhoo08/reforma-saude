name: Radar de notícias

# A rotina do Claude roda numa nuvem que não abre sites; este robô baixa as manchetes para ela.
on:
  schedule:
    - cron: "15 9 * * *" # 06h15 em São Paulo, antes da rotina das 7h
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/radar.py", "tools/test_radar.py", ".github/workflows/radar.yml"]

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: true

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Testa o radar
        run: python3 tools/test_radar.py
      - name: Baixa as manchetes
        run: python3 tools/radar.py "$RUNNER_TEMP/radar"
      - name: Publica na branch radar
        working-directory: ${{ runner.temp }}/radar
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init -q -b radar
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Radar $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" radar
